name: CI - Pytest

on:
  pull_request:
    branches:
      - main
      - development

# Cancel any currently running workflow in the same group to prevent duplicates
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (Makefile)
        run: |
          python -m pip install --upgrade pip
          make install

      - name: Run tests (Makefile)
        run: |
          make test
